
<!DOCTYPE html>
<html>
<head>
    <title>MEMORIX</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">
    <h1>MEMORIX</h1>
    <p>RGB MEMORY CHALLENGE</p>

    <div class="score">
        <span>LEVEL: <b id="level">0</b></span>
        <span>BEST: <b id="best">0</b></span>
    </div>

    <div class="board">
        <button class="color green" data-color="green"></button>
        <button class="color red" data-color="red"></button>
        <button class="color yellow" data-color="yellow"></button>
        <button class="color blue" data-color="blue"></button>
    </div>

    <p id="message">Ready to Play?</p>
    <button id="start">START GAME</button>
    <p class="footer">⚡ TEST YOUR MEMORY ⚡</p>
</div>

<script src="game.js"></script>
</body>
</html>
